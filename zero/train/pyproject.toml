[project]
name = "blokuszero-train"
version = "0.1.0"
description = "Training for BlokusZero: the network, ONNX export, and training."
requires-python = ">=3.13"
dependencies = [
    "absl-py>=2.5.1",
    "bagz>=0.3.8",
    "grain>=0.2.18",
    "numpy",
    "onnx",
    "onnxruntime",
    "onnxscript",
    # Matches protobuf in MODULE.bazel, whose protoc generates training_pb2.py.
    "protobuf==7.36.2",
    "torch",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
