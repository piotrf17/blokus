[project]
name = "blokuszero-train"
version = "0.1.0"
description = "Training for BlokusZero: the network, ONNX export, and training."
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "onnx",
    "onnxruntime",
    "onnxscript",
    "torch",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
